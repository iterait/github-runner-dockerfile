services:
  github-runner:
    image: iterait/github-runner:2.334.0
    restart: unless-stopped
    # give the runner time to finish deregistering from GitHub on `docker compose down`
    stop_grace_period: 60s
    environment:
      REPOSITORY: iterait/github-runner-dockerfile  # use your own github repository
      ACCESS_TOKEN: ghp_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX  # use your own github personal access token
      WORKER_NAME: my-runner-name
      WORKER_LABELS: linux,X64,docker,self-hosted
      RUNNER_WORKDIR: /tmp/github-runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Must be mounted at the same path as on the host, so that paths passed to the host
      # docker daemon (`docker run -v $PWD:...`, `container:` jobs, ...) resolve correctly.
      - /tmp/github-runner:/tmp/github-runner
    deploy:
      mode: replicated
      replicas: 4
